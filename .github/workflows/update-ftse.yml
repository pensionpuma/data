name: Update FTSE 100 close

on:
  schedule:
    # 17:00 UK local time, Monday–Friday — 30 minutes after the LSE's 16:30
    # close. GitHub Actions cron always runs in UTC and doesn't shift for
    # daylight saving, so two schedules are used to keep this pinned to
    # 17:00 UK time year-round: one for BST months (UTC+1) and one for GMT
    # months (UTC+0). The cutover here is the calendar month boundary rather
    # than the exact last-Sunday-of-March/October transition (cron can't
    # express that precisely) — during that one transition week the trigger
    # may land up to an hour early or late, which is harmless: the script
    # only accepts a day's close once Yahoo confirms that session has
    # actually ended, and safely falls back to the previous valid close
    # otherwise.
    - cron: '0 16 4-9 * 1-5'             # BST (UTC+1): Apr–Sep, 16:00 UTC = 17:00 BST
    - cron: '0 17 10,11,12,1,2,3 * 1-5'  # GMT (UTC+0): Oct–Mar, 17:00 UTC = 17:00 GMT
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

# Needed so the workflow can push the updated file back to the repo.
permissions:
  contents: write

jobs:
  update-ftse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch FTSE 100 data and write ftse.txt
        run: node scripts/update-ftse.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- ftse.txt; then
            git add ftse.txt
            git commit -m "Update FTSE 100 close ($(date -u +'%Y-%m-%d'))"
            git push
          else
            echo "No change in ftse.txt — nothing to commit."
          fi
