name: Daily Silver Prediction

on:
  schedule:
    # GitHub Actions cron is UTC only and ignores UK daylight saving, so
    # we trigger at BOTH 05:30 UTC (= 06:30 BST) and 06:30 UTC (= 06:30 GMT).
    # Scheduled runs are often delayed by many minutes, so the gate below
    # checks the UK *hour* (06 or 07), not an exact minute. The script
    # itself refuses to write a second line for the same UK date.
    - cron: "30 5 * * 1-5"
    - cron: "30 6 * * 1-5"
  workflow_dispatch: {}   # allows manual trigger for testing

permissions:
  contents: write   # lets the default GITHUB_TOKEN push the commit back

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Gate on UK time window
        id: gate
        run: |
          UK_TIME=$(TZ="Europe/London" date +%H:%M)
          UK_HOUR=$(TZ="Europe/London" date +%H)
          echo "Event: ${{ github.event_name }} | Current UK time: $UK_TIME"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"   # manual runs always go
          elif [ "$UK_HOUR" = "06" ] || [ "$UK_HOUR" = "07" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.proceed == 'true'
        run: pip install requests

      - name: Run prediction and push
        if: steps.gate.outputs.proceed == 'true'
        env:
          METALCHARTS_API_KEY: ${{ secrets.METALCHARTS_API_KEY }}
        run: python predict_silver.py
